name: Release

# Builds BBF Code installers for Windows, Linux and macOS and attaches them to a
# GitHub Release.
#
# Each job builds the BBF AI Coder engine natively with bun from bbf-ai-engine/
# and places it at resources/app/bin/ inside the package, which is where the
# extension looks for it (extensions/bbf-ai-coder/src/engineProcess.ts).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Skip downloads the build does not need on CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  npm_config_foreground_scripts: 'true'
  # The built-in Microsoft extensions (js-debug, ...) are fetched from their
  # GitHub releases; authenticated requests avoid the anonymous rate limit.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ENGINE_BUN_VERSION: 1.4.2

jobs:
  windows:
    name: Windows x64 (Inno Setup)
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ENGINE_BUN_VERSION }}

      - name: Build engine (opencode-windows-x64)
        shell: bash
        working-directory: bbf-ai-engine
        run: |
          bun install
          cd packages/opencode
          bun run script/build.ts --single --skip-install --skip-embed-web-ui
          ls -la dist/opencode-windows-x64/bin

      # build/npm/preinstall.ts accepts a C++ toolchain only in a folder named
      # "2022" or "2019", while the runner ships Visual Studio 2026 under
      # "Microsoft Visual Studio\18". node-gyp finds that install by itself, so
      # pointing the override at whatever vswhere reports keeps the check
      # honest instead of loosening it.
      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the C++ tools was found on this runner." }
          Write-Host "Using Visual Studio at $vs"
          "vs2022_install=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      # Transpiles and bundles with esbuild, compiles the built-in extensions,
      # and packages into ../VSCode-win32-x64 (see build/gulpfile.vscode.ts).
      - name: Build and package
        run: npm run gulp vscode-win32-x64-min

      - name: Add engine to package
        shell: bash
        run: |
          mkdir -p ../VSCode-win32-x64/resources/app/bin
          cp bbf-ai-engine/packages/opencode/dist/opencode-windows-x64/bin/opencode.exe ../VSCode-win32-x64/resources/app/bin/opencode.exe

      - name: Build installers
        run: |
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup
          npm run gulp vscode-win32-x64-system-setup

      - name: Collect
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          cp .build/win32-x64/user-setup/BBFCodeSetup.exe   "dist-release/BBFCodeUserSetup-x64-$VERSION.exe"
          cp .build/win32-x64/system-setup/BBFCodeSetup.exe "dist-release/BBFCodeSetup-x64-$VERSION.exe"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-release/*
          if-no-files-found: error

  linux:
    name: Linux x64 (deb, rpm, tar.gz)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ python3 libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rpm pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ENGINE_BUN_VERSION }}

      - name: Build engine (opencode-linux-x64)
        working-directory: bbf-ai-engine
        run: |
          bun install
          cd packages/opencode
          bun run script/build.ts --single --skip-install --skip-embed-web-ui
          ls -la dist/opencode-linux-x64/bin

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run gulp vscode-linux-x64-min

      - name: Add engine to package
        run: |
          mkdir -p ../VSCode-linux-x64/resources/app/bin
          cp bbf-ai-engine/packages/opencode/dist/opencode-linux-x64/bin/opencode ../VSCode-linux-x64/resources/app/bin/opencode
          chmod +x ../VSCode-linux-x64/resources/app/bin/opencode

      # The archive is the artifact every Linux user can install, so it is made
      # before the packages below, which need more of the product to be present.
      - name: Build tar.gz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          tar -czf "dist-release/bbf-code-linux-x64-$VERSION.tar.gz" -C .. VSCode-linux-x64

      # deb and rpm compute their shared-library dependencies by reading every
      # binary in the package, the tunnel CLI included
      # (build/linux/dependencies-generator.ts), so the Rust CLI has to exist
      # before either can be built. It is a separate toolchain, and a failure
      # here must not cost the release the archive above, so this step and the
      # two package steps are allowed to fail and report a warning.
      - name: Build CLI (tunnel binary)
        id: cli
        continue-on-error: true
        working-directory: cli
        run: |
          cargo build --release
          mkdir -p ../../VSCode-linux-x64/bin
          cp target/release/code "../../VSCode-linux-x64/bin/$(node -p "require('../product.json').tunnelApplicationName")"
          chmod +x "../../VSCode-linux-x64/bin/$(node -p "require('../product.json').tunnelApplicationName")"

      - name: Build deb
        id: deb
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Build rpm
        id: rpm
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        run: |
          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm

      - name: Collect
        run: |
          cp .build/linux/deb/amd64/deb/*.deb dist-release/ 2>/dev/null || echo "no deb produced (CLI: ${{ steps.cli.outcome }}, deb: ${{ steps.deb.outcome }})"
          cp .build/linux/rpm/x86_64/rpmbuild/RPMS/x86_64/*.rpm dist-release/ 2>/dev/null || echo "no rpm produced (rpm: ${{ steps.rpm.outcome }})"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist-release/*
          if-no-files-found: error

  macos:
    name: macOS arm64 (zip, dmg)
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ENGINE_BUN_VERSION }}

      - name: Build engine (opencode-darwin-arm64)
        working-directory: bbf-ai-engine
        run: |
          bun install
          cd packages/opencode
          bun run script/build.ts --single --skip-install --skip-embed-web-ui
          ls -la dist/opencode-darwin-arm64/bin

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run gulp vscode-darwin-arm64-min

      - name: Add engine to package
        run: |
          APP="../VSCode-darwin-arm64/BBF Code.app"
          mkdir -p "$APP/Contents/Resources/app/bin"
          cp bbf-ai-engine/packages/opencode/dist/opencode-darwin-arm64/bin/opencode "$APP/Contents/Resources/app/bin/opencode"
          chmod +x "$APP/Contents/Resources/app/bin/opencode"

      # Unsigned: users must right-click > Open (or remove the quarantine
      # attribute) the first time. Add Developer ID signing + notarization here
      # when the certificate is available.
      - name: Collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          (cd ../VSCode-darwin-arm64 && ditto -c -k --keepParent "BBF Code.app" "$GITHUB_WORKSPACE/dist-release/BBFCode-darwin-arm64-$VERSION.zip")
          hdiutil create -volname "BBF Code" -srcfolder "../VSCode-darwin-arm64/BBF Code.app" -ov -format UDZO "dist-release/BBFCode-darwin-arm64-$VERSION.dmg"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: BBF Code ${{ github.ref_name }}
          files: assets/*
          fail_on_unmatched_files: true
